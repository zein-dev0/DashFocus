<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashFocus | جدول الساعات المخصص</title>
    <link rel="shortcut icon" href="../assets/icons/hourglass.webp" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- 🚀 إضافة مكتبة html2canvas لتحويل الجدول إلى صورة بدقة عالية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="dashboard-wrapper single-page-wrapper" style="max-width: 1200px;">
        <section class="glass-panel planner-section page-panel">
            <h2><i class="fa-solid fa-sliders"></i> جدول الساعات الأسبوعي المخصص</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px;">حدّد نطاق ساعات يومك الدراسي بالأسفل لتوليد شبكة الجدول الزجاجية الخاصة بك.</p>

            <div class="board-input-group-wrapper shortcuts-form-group" style="display: flex; flex-direction: column; width: 100%; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 15px; gap: 15px; box-sizing: border-box; margin-bottom: 25px;">
                
                <div class="planner-config-inputs" style="display: flex; gap: 15px; width: 100%; flex-wrap: wrap;">
                    <div style="display: flex; align-items: center; gap: 8px; flex: 1; min-width: 100%;">
                        <label style="font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; min-width: 80px;">وقت البداية:</label>
                        <select id="config-start-hour" style="flex: 1; background: rgba(15, 23, 42, 0.6) !important; border: 1px solid rgba(255,255,255,0.06) !important; border-radius: 6px; padding: 10px; color: var(--text-main); cursor: pointer; outline: none;"></select>
                    </div>
                    
                    <div style="display: flex; align-items: center; gap: 8px; flex: 1; min-width: 100%;">
                        <label style="font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; min-width: 80px;">وقت النهاية:</label>
                        <select id="config-end-hour" style="flex: 1; background: rgba(15, 23, 42, 0.6) !important; border: 1px solid rgba(255,255,255,0.06) !important; border-radius: 6px; padding: 10px; color: var(--text-main); cursor: pointer; outline: none;"></select>
                    </div>
                </div>

                <!-- أزرار التحكم: التحديث وحفظ الجدول التلقائي المصطف بشكل متناسق ومتجاوب -->
                <div class="shortcuts-action-row" style="display: flex; gap: 12px; width: 100%; flex-wrap: wrap;">
                    <button id="apply-config-btn" class="glow-btnNotHover" style="flex: 1; min-width: 150px; padding: 12px; border-radius: 8px; font-weight: bold; height: 44px; white-space: nowrap;">تحديث بنية الجدول</button>
                    <button id="download-planner-btn" class="glow-btnNotHover" style="flex: 1; min-width: 150px; padding: 12px; border-radius: 8px; font-weight: bold; height: 44px; white-space: nowrap; background: var(--neon-purple); border-color: var(--neon-purple);">
                        <i class="fa-solid fa-camera" style="margin-left: 5px;"></i> حفظ الجدول كصورة
                    </button>
                </div>
            </div>

            <!-- حاوية الجدول المعطاة معرف مخصص (timetable-capture-area) لالتقاطها بالكامل -->
            <div id="timetable-capture-area" style="width: 100%; overflow-x: auto; background: rgba(0, 0, 0, 0.15); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: inset 0 4px 10px rgba(0,0,0,0.2); padding: 5px;">
                <table class="planner-timetable" style="width: 100%; min-width: 850px; border-collapse: collapse; text-align: center; font-size: 0.9rem; direction: rtl;">
                    <thead>
                        <tr id="timetable-header-row" style="background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.08);">
                        </tr>
                    </thead>
                    <tbody id="timetable-body">
                    </tbody>
                </table>
            </div>
        </section>

        <div class="navigation-bar">
            <a href="../index.html" class="glow-btn outline back-home-btn">
                <i class="fa-solid fa-arrow-right"></i> العودة للوحة الرئيسية
            </a>
        </div>
    </div>

    <script src="../js/main.js" defer></script>
    <script src="../js/weekly-planner.js" defer></script>
</body>
</html>
